[package]
name = "thme"
version = "0.1.9"
edition = "2021"
rust-version = "1.89"
authors = ["Epiphanes <https://github.com/EdEpiphanes>"]
description = "THME: Topological Heterogeneous Manifold Engine by Epiphanes - Open-source framework for LLM memory profiling, weight sensitivity analysis, and Pareto precision optimization."
license = "AGPL-3.0-only"
repository = "https://github.com/EdEpiphanes/THME-Epiphanes"
readme = "README.md"
keywords = ["llm", "quantization", "optimization", "transformer", "kv-cache"]
categories = ["command-line-utilities", "science"]

[lib]
name = "thme"
path = "src/lib.rs"

[[bin]]
name = "thme"
path = "src/main.rs"

[[bin]]
name = "llm-tweaker"
path = "src/bin/llm_tweaker.rs"

[[bin]]
name = "thme-gui"
path = "src/bin/gui.rs"

[[example]]
name = "generate_mock_model"
path = "examples/generate_mock_model.rs"

[[example]]
name = "production_verification"
path = "examples/production_verification.rs"

[[example]]
name = "precision_sweep"
path = "examples/precision_sweep.rs"

[[example]]
name = "depth_probe"
path = "examples/depth_probe.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
safetensors = "0.5"
memmap2 = "0.9"
comfy-table = "7.1"
anyhow = "1.0"
eframe = { version = "0.31", default-features = true }
rfd = "0.15"
minisign = "0.10.0"

# Developer sandbox (docs/sandbox.md): OS isolation layers, approved by the owner.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.17"
# Host description in examples/production_verification.rs only.
sysinfo = "0.33"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

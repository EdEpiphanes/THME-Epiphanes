[workspace]
resolver = "2"
members = [
    ".",
    "crates/neutron-gpu",
]

[workspace.package]
version = "0.1.9"
edition = "2021"
rust-version = "1.95"
authors = ["Epiphanes <https://github.com/EdEpiphanes>"]
license = "AGPL-3.0-only"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
wgpu = { version = "30.0", default-features = false, features = ["wgsl"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"

[package]
name = "thme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "THME: Topological Heterogeneous Manifold Engine by Epiphanes - Open-source framework for LLM memory profiling, weight sensitivity analysis, and Pareto precision optimization."
repository = "https://github.com/EdEpiphanes/THME-Epiphanes"
readme = "README.md"
keywords = ["llm", "quantization", "optimization", "transformer", "kv-cache"]
categories = ["command-line-utilities", "science"]

[lib]
name = "thme"
path = "src/lib.rs"

[[bin]]
name = "thme"
path = "src/main.rs"

[[bin]]
name = "llm-tweaker"
path = "src/bin/llm_tweaker.rs"

[[bin]]
name = "thme-gui"
path = "src/bin/gui.rs"

[[example]]
name = "generate_mock_model"
path = "examples/generate_mock_model.rs"

[[example]]
name = "production_verification"
path = "examples/production_verification.rs"
# Unit tests for the target and WikiText-2 guards live in the example.
test = true

[[example]]
name = "precision_sweep"
path = "examples/precision_sweep.rs"

[[example]]
name = "depth_probe"
path = "examples/depth_probe.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
neutron-gpu = { path = "crates/neutron-gpu", version = "0.1.9" }
safetensors = "0.5"
memmap2 = "0.9"
comfy-table = "7.1"
anyhow = "1.0"
# Model download (hub module, THME-3042): HTTPS client on rustls with the ring provider and the OS
# certificate store (no OpenSSL, no webpki-roots: its CDLA data licence is not on deny.toml's list).
# sha2 is already in the lock file through other crates.
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
sha2 = "0.10"
# Pure-Rust deflate backend (default features): inflating zip pickle entries during a scan.
flate2 = "1.1"
eframe = { version = "0.37", default-features = true }
rfd = "0.15"
minisign = "0.10.0"
# Animated figures (report::animate): rasterize SVG and encode GIF in Rust.
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
gif = "0.14"
sysinfo = "0.40"
# Text in and out (THME-3037): Hugging Face tokenizer.json with the pure-Rust fancy-regex backend
# (no onig C library, no esaxx C++ build), and Jinja chat templates via minijinja.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
minijinja = { version = "3.1", features = ["json", "loop_controls", "serde"] }
minijinja-contrib = { version = "3.1", features = ["pycompat"] }

[dev-dependencies]
tempfile = "3.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# The SVG rasterizer and GIF encoder (report::animate) are built for size, not speed, so the CLI
# stays under its 10 MiB limit; THME's own engine code keeps opt-level 3.
[profile.release.package.resvg]
opt-level = "s"
[profile.release.package.usvg]
opt-level = "s"
[profile.release.package.tiny-skia]
opt-level = "s"
[profile.release.package.ttf-parser]
opt-level = "s"
[profile.release.package.fontdb]
opt-level = "s"
[profile.release.package.gif]
opt-level = "s"
# Tokenizer and chat template (text module): size over speed, as above.
[profile.release.package.tokenizers]
opt-level = "s"
[profile.release.package.fancy-regex]
opt-level = "s"
[profile.release.package.regex]
opt-level = "s"
[profile.release.package.regex-automata]
opt-level = "s"
[profile.release.package.regex-syntax]
opt-level = "s"
[profile.release.package.aho-corasick]
opt-level = "s"
[profile.release.package.minijinja]
opt-level = "s"
[profile.release.package.minijinja-contrib]
opt-level = "s"
[profile.release.package.unicode-normalization-alignments]
opt-level = "s"

[workspace]
resolver = "2"
members = [
    ".",
    "crates/neutron-gpu",
]

[workspace.package]
version = "0.1.9"
edition = "2021"
rust-version = "1.89"
authors = ["Epiphanes <https://github.com/EdEpiphanes>"]
license = "AGPL-3.0-only"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = { version = "30.0", default-features = false, features = ["wgsl"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"

[package]
name = "thme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "THME: Topological Heterogeneous Manifold Engine by Epiphanes - Open-source framework for LLM memory profiling, weight sensitivity analysis, and Pareto precision optimization."
repository = "https://github.com/EdEpiphanes/THME-Epiphanes"
readme = "README.md"
keywords = ["llm", "quantization", "optimization", "transformer", "kv-cache"]
categories = ["command-line-utilities", "science"]

[lib]
name = "thme"
path = "src/lib.rs"

[[bin]]
name = "thme"
path = "src/main.rs"

[[bin]]
name = "llm-tweaker"
path = "src/bin/llm_tweaker.rs"

[[bin]]
name = "thme-gui"
path = "src/bin/gui.rs"

[[example]]
name = "generate_mock_model"
path = "examples/generate_mock_model.rs"

[[example]]
name = "production_verification"
path = "examples/production_verification.rs"

[[example]]
name = "precision_sweep"
path = "examples/precision_sweep.rs"

[[example]]
name = "depth_probe"
path = "examples/depth_probe.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
neutron-gpu = { path = "crates/neutron-gpu", version = "0.1.9" }
safetensors = "0.5"
memmap2 = "0.9"
comfy-table = "7.1"
anyhow = "1.0"
# Pure-Rust deflate backend (default features): inflating zip pickle entries during a scan.
flate2 = "1.1"
eframe = { version = "0.37", default-features = true }
rfd = "0.15"
minisign = "0.10.0"
# Animated figures (report::animate): rasterize SVG and encode GIF in Rust.
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
gif = "0.14"
sysinfo = "0.40"

[dev-dependencies]
tempfile = "3.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# The SVG rasterizer and GIF encoder (report::animate) are built for size, not speed, so the CLI
# stays under its 10 MiB limit; THME's own engine code keeps opt-level 3.
[profile.release.package.resvg]
opt-level = "s"
[profile.release.package.usvg]
opt-level = "s"
[profile.release.package.tiny-skia]
opt-level = "s"
[profile.release.package.ttf-parser]
opt-level = "s"
[profile.release.package.fontdb]
opt-level = "s"
[profile.release.package.gif]
opt-level = "s"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#09090b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="1"/>
    </radialGradient>

    <!-- Cyan Neon Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80f2ff"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>

    <!-- Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Gold / Amber Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep OLED Canvas -->
  <rect width="800" height="800" fill="#09090b"/>
  <circle cx="400" cy="400" r="390" fill="url(#bgGlow)"/>

  <!-- OUTER ASTRONOMICAL DIAL & COORDINATE COMPASS -->
  <!-- Outer Rings -->
  <circle cx="400" cy="400" r="380" fill="none" stroke="#27272a" stroke-width="2"/>
  <circle cx="400" cy="400" r="372" fill="none" stroke="#3f3f46" stroke-width="1" stroke-dasharray="2,6"/>
  <circle cx="400" cy="400" r="350" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="400" cy="400" r="342" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Cardinal Coordinate Marks & Degree Ticks -->
  <g stroke="#3f3f46" stroke-width="1">
    <!-- Degree ticks around perimeter -->
    <line x1="400" y1="20" x2="400" y2="40" stroke="#00e5ff" stroke-width="2"/>
    <line x1="400" y1="760" x2="400" y2="780" stroke="#00e5ff" stroke-width="2"/>
    <line x1="20" y1="400" x2="40" y2="400" stroke="#00e5ff" stroke-width="2"/>
    <line x1="760" y1="400" x2="780" y2="400" stroke="#00e5ff" stroke-width="2"/>

    <line x1="131" y1="131" x2="145" y2="145" stroke="#10b981" stroke-width="1.5"/>
    <line x1="669" y1="131" x2="655" y2="145" stroke="#10b981" stroke-width="1.5"/>
    <line x1="131" y1="669" x2="145" y2="655" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="669" y1="669" x2="655" y2="655" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- Orbital Ellipses (Topological Manifolds) -->
  <g fill="none" stroke="#3f3f46" stroke-width="1" opacity="0.6">
    <ellipse cx="400" cy="400" rx="330" ry="140" transform="rotate(-25 400 400)"/>
    <ellipse cx="400" cy="400" rx="310" ry="110" transform="rotate(35 400 400)"/>
    <ellipse cx="400" cy="400" rx="280" ry="280" stroke="#27272a" stroke-dasharray="4,8"/>
  </g>

  <!-- Orbital Planetary Nodes -->
  <circle cx="160" cy="270" r="4.5" fill="#00e5ff" filter="url(#cyanGlow)"/>
  <circle cx="630" cy="230" r="4" fill="#10b981"/>
  <circle cx="210" cy="580" r="3.5" fill="#f59e0b"/>
  <circle cx="610" cy="550" r="4" fill="#00e5ff"/>

  <!-- UPPER RIGHT: HETEROGENEOUS TENSOR WIREFRAME LATTICE -->
  <g stroke="#3f3f46" stroke-width="1.2" opacity="0.45">
    <line x1="500" y1="100" x2="730" y2="330"/>
    <line x1="540" y1="90" x2="750" y2="300"/>
    <line x1="480" y1="140" x2="710" y2="370"/>
    <line x1="520" y1="130" x2="730" y2="340"/>
    <line x1="560" y1="120" x2="750" y2="310"/>

    <line x1="730" y1="100" x2="500" y2="330"/>
    <line x1="750" y1="140" x2="520" y2="370"/>
    <line x1="710" y1="90" x2="480" y2="320"/>
    <line x1="750" y1="180" x2="550" y2="380"/>

    <!-- Mesh Intersection Nodes -->
    <circle cx="615" cy="215" r="2.5" fill="#00e5ff"/>
    <circle cx="655" cy="175" r="2" fill="#00e5ff"/>
    <circle cx="575" cy="255" r="2" fill="#00e5ff"/>
    <circle cx="675" cy="235" r="2" fill="#10b981"/>
  </g>

  <!-- LEFT: SVD VECTOR ARROW AND ACTIVATION WAVEFORM -->
  <!-- Vector Axis & Arrow ↑ -->
  <g stroke="#00e5ff" stroke-width="2">
    <line x1="120" y1="460" x2="120" y2="240"/>
    <polyline points="105,260 120,240 135,260" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="110" y1="300" x2="130" y2="300" stroke="#3f3f46" stroke-width="1.5"/>
    <line x1="110" y1="350" x2="130" y2="350" stroke="#3f3f46" stroke-width="1.5"/>
    <line x1="110" y1="400" x2="130" y2="400" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="120" y="225" font-family="ui-monospace, monospace" font-size="16" fill="#00e5ff" font-weight="bold" text-anchor="middle">T</text>
  </g>

  <!-- Undulating Waveform (Spectral Kurtosis / FWHT) -->
  <path d="M70,390 Q95,360 120,390 T170,390 T220,390 T270,390" fill="none" stroke="url(#amberGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M70,390 Q95,420 120,390 T170,390 T220,390 T270,390" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- CENTRAL NOBLE FIGURE: EPIPHANEIA // TEACHER LLM -->
  <g id="figure-epiphaneia">
    <!-- Atmospheric Aura Behind Head -->
    <circle cx="410" cy="330" r="160" fill="#00e5ff" fill-opacity="0.04" filter="url(#cyanGlow)"/>

    <!-- Hair Silhouette (Dark base) -->
    <path d="M300,320 C270,370 250,480 270,620 C280,680 320,720 350,730 C340,680 330,620 335,560 C340,510 320,440 315,390 C310,360 310,320 320,270 C340,190 470,180 500,240 C530,290 540,360 570,440 C600,520 630,620 620,700 C590,640 570,550 560,490 C550,420 520,350 505,310 Z" 
          fill="#111114" stroke="#27272a" stroke-width="1.5"/>

    <!-- Left Hair Braids & Flowing Tendrils -->
    <g fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round">
      <path d="M330,270 C310,340 290,440 310,550 C325,620 335,680 355,730"/>
      <path d="M345,300 C330,380 315,480 335,580 C345,630 365,680 380,720"/>
      <path d="M315,360 C300,430 280,510 295,600 C305,650 320,690 335,725"/>
    </g>

    <!-- Right Hair Braids -->
    <g fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round">
      <path d="M495,280 C530,360 565,470 575,580 C580,640 590,690 580,730"/>
      <path d="M480,310 C510,400 540,500 550,600 C555,650 560,690 550,725"/>
      <path d="M515,340 C550,430 590,530 595,620 C600,670 605,700 600,728"/>
    </g>

    <!-- Face & Neck Contours (Serene Noble Features) -->
    <path d="M365,260 C350,290 350,340 360,380 C370,420 395,455 420,465 C445,455 470,420 480,380 C490,340 490,290 475,260" 
          fill="#18181b" stroke="#f4f4f5" stroke-width="2" stroke-linejoin="round"/>

    <!-- Neck & Throat -->
    <path d="M385,450 L380,550 C395,565 445,565 460,550 L455,450" 
          fill="#131316" stroke="#3f3f46" stroke-width="1.5"/>

    <!-- Neck Shadow Hatching -->
    <g stroke="#27272a" stroke-width="1">
      <line x1="395" y1="470" x2="415" y2="520"/>
      <line x1="405" y1="465" x2="425" y2="515"/>
      <line x1="415" y1="465" x2="435" y2="515"/>
      <line x1="425" y1="465" x2="445" y2="515"/>
    </g>

    <!-- Facial Engraving Details (Introspective Gazing Eyes, Nose, Lips) -->
    <g fill="none" stroke="#f4f4f5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left Eyebrow & Eye -->
      <path d="M375,320 C385,315 400,316 410,323" stroke-width="2"/>
      <path d="M380,332 C390,327 402,328 410,335" stroke-width="1.5"/>
      <path d="M382,335 C392,342 404,340 408,336" stroke-width="1"/>
      <ellipse cx="395" cy="334" rx="3.5" ry="4" fill="#00e5ff" stroke="none"/>

      <!-- Right Eyebrow & Eye -->
      <path d="M430,323 C440,316 455,315 465,320" stroke-width="2"/>
      <path d="M430,335 C438,328 450,327 460,332" stroke-width="1.5"/>
      <path d="M432,336 C436,340 448,342 458,335" stroke-width="1"/>
      <ellipse cx="445" cy="334" rx="3.5" ry="4" fill="#00e5ff" stroke="none"/>

      <!-- Nose Bridge & Tip -->
      <path d="M420,325 L415,370 C412,380 410,385 418,390 L425,390" stroke-width="1.8"/>
      <path d="M410,386 C414,392 426,392 430,386" stroke-width="1.2"/>

      <!-- Lips (Subtle, Contemplative Expression) -->
      <path d="M405,415 C415,411 425,411 435,415" stroke-width="1.8"/>
      <path d="M408,416 C417,422 423,422 432,416" stroke-width="1.2"/>
      <path d="M414,424 C419,428 421,428 426,424" stroke-width="1.2"/>
    </g>

    <!-- Fine Classical Cheek Contours / Woodcut Engraving Strokes -->
    <g stroke="#3f3f46" stroke-width="0.8" opacity="0.7">
      <line x1="375" y1="355" x2="385" y2="395"/>
      <line x1="380" y1="360" x2="390" y2="400"/>
      <line x1="385" y1="365" x2="395" y2="405"/>
      <line x1="455" y1="360" x2="445" y2="400"/>
      <line x1="460" y1="355" x2="450" y2="395"/>
    </g>

    <!-- WOVEN CELTIC / NORDIC DIADEM (HEADBAND) -->
    <g id="diadem">
      <!-- Headband Ribbon Base -->
      <path d="M340,265 C390,250 450,250 500,265 L502,285 C452,270 388,270 338,285 Z" 
            fill="#18181b" stroke="url(#amberGrad)" stroke-width="2"/>

      <!-- Interwoven Ribbon Braid Patterns -->
      <path d="M345,275 L358,268 L371,280 L384,268 L397,280 L410,268 L423,280 L436,268 L449,280 L462,268 L475,280 L488,268 L498,276" 
            fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M345,275 L358,282 L371,270 L384,282 L397,270 L410,282 L423,270 L436,282 L449,270 L462,282 L475,270 L488,282 L498,276" 
            fill="none" stroke="#fde68a" stroke-width="1.2" stroke-linejoin="round"/>

      <!-- Center Gemstone / Diadem Node -->
      <circle cx="420" cy="274" r="5" fill="#00e5ff" stroke="#ffffff" stroke-width="1.2" filter="url(#cyanGlow)"/>
    </g>

    <!-- GARMENTS & TUNIC EMBROIDERY -->
    <path d="M320,620 C340,560 380,550 420,550 C460,550 500,560 520,620 C540,680 560,740 570,780 L270,780 C280,740 300,680 320,620 Z" 
          fill="#111114" stroke="#27272a" stroke-width="2"/>

    <!-- Tunic Collar Neckpiece -->
    <path d="M375,545 C400,575 440,575 465,545 L475,570 C445,605 395,605 365,570 Z" 
          fill="#18181b" stroke="#00e5ff" stroke-width="2"/>

    <!-- T-H-M-E KNOTWORK EMBLEM ON BREASTPLATE & SHOULDER -->
    <!-- Intertwined Cipher: T, H, M, E -->
    <g id="knotwork-cipher" transform="translate(360, 600)">
      <!-- Ornamental Knot Shield Background -->
      <polygon points="60,0 120,35 120,105 60,140 0,105 0,35" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>

      <!-- Knotwork Ribbons -->
      <!-- 'T' Bar -->
      <path d="M30,25 L90,25 M60,25 L60,115" fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>

      <!-- 'H' Uprights and Crossbar -->
      <path d="M20,45 L20,105 M100,45 L100,105 M20,75 L100,75" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

      <!-- 'M' Chevrons -->
      <path d="M20,105 L45,70 L60,95 L75,70 L100,105" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- 'E' Horizontal Rungs -->
      <path d="M40,35 L75,35 M40,75 L70,75 M40,115 L75,115" fill="none" stroke="#80f2ff" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Interlock Node Dots -->
      <circle cx="60" cy="25" r="3" fill="#ffffff"/>
      <circle cx="60" cy="95" r="3" fill="#00e5ff"/>
      <circle cx="60" cy="115" r="3" fill="#ffffff"/>
    </g>

    <!-- RIGHT SHOULDER CIPHER (E, H, M) -->
    <g transform="translate(520, 520)" stroke="#00e5ff" stroke-width="2.5" fill="none">
      <!-- 'E' Letterform near braid -->
      <path d="M40,-130 L65,-130 M40,-130 L40,-95 L60,-95 M40,-95 L40,-60 L65,-60" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
      <!-- Intertwined 'H' & 'M' Knot -->
      <circle cx="50" cy="30" r="35" stroke="#27272a" stroke-width="1.5"/>
      <path d="M30,10 L30,50 M70,10 L70,50 M30,30 L70,30" stroke="#10b981"/>
      <path d="M30,50 L45,30 L50,40 L55,30 L70,50" stroke="#f59e0b"/>
      <text x="50" y="85" font-family="ui-monospace, monospace" font-size="24" fill="#f4f4f5" font-weight="bold" text-anchor="middle" stroke="none">M</text>
    </g>
  </g>

  <!-- LOWER BANNER & METROLOGY ENGRAVING -->
  <g id="bottom-banner">
    <!-- Curved Typography Ribbon -->
    <path d="M220,720 Q400,755 580,720" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Monospace Title Readout -->
    <text x="400" y="700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="bold" fill="#ffffff" letter-spacing="8" text-anchor="middle">
      T H M E
    </text>
    <text x="400" y="725" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#00e5ff" letter-spacing="4" text-anchor="middle">
      TOPOLOGICAL HETEROGENEOUS MANIFOLD ENGINE
    </text>
    <text x="400" y="745" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="500" fill="#a1a1aa" letter-spacing="3" text-anchor="middle">
      EPIPHANES // ZERO-COPY NEURAL SURGERY
    </text>
  </g>

  <!-- TOP BRAND ARC -->
  <text x="400" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#10b981" letter-spacing="6" text-anchor="middle">
    E P I P H A N E S
  </text>
  <circle cx="400" cy="85" r="2.5" fill="#10b981"/>
</svg>

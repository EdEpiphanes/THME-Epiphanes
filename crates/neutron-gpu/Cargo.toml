[package]
name = "neutron-gpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Read-only PCI/vGPU accelerator discovery and vGPU metadata"

[[bin]]
name = "neutron-gpu"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wgpu = { workspace = true, optional = true }

[features]
default = []
wgpu = ["dep:wgpu"]

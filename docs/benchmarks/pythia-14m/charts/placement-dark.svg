<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" role="img" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title>Placement matters: the recipe against random placement</title>
<desc>Perplexity increase for the surgery recipe compared with three random placements of the same formats.</desc>
<rect x="0.5" y="0.5" width="759" height="265" rx="8" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24.0" y="34.0" font-size="16" font-weight="600" fill="#f0efec" text-anchor="start">Placement matters: the recipe against random placement</text>
<text x="24.0" y="54.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">Δ perplexity vs baseline 113.70 · same tensor counts and shapes in every row · all rows are outside the 0.45 gate</text>
<line x1="232.0" y1="74.0" x2="232.0" y2="204.0" stroke="#383835" stroke-width="1"/>
<text x="220.0" y="93.0" font-size="12" font-weight="400" fill="#f0efec" text-anchor="end">Sensitivity-guided recipe</text>
<path d="M232.0,80.0 h285.3 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-285.3 z" fill="#3987e5"/>
<text x="529.3" y="93.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">+508.3</text>
<text x="220.0" y="127.0" font-size="12" font-weight="400" fill="#f0efec" text-anchor="end">Random placement, seed 2</text>
<path d="M232.0,114.0 h330.4 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-330.4 z" fill="#898781"/>
<text x="574.4" y="127.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">+587.5</text>
<text x="220.0" y="161.0" font-size="12" font-weight="400" fill="#f0efec" text-anchor="end">Random placement, seed 3</text>
<path d="M232.0,148.0 h330.4 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-330.4 z" fill="#898781"/>
<text x="574.4" y="161.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">+587.5</text>
<text x="220.0" y="195.0" font-size="12" font-weight="400" fill="#f0efec" text-anchor="end">Random placement, seed 1</text>

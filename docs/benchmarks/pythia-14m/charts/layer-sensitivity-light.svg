<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title>Perplexity cost of ternarizing one layer at a time</title>
<desc>Per-layer increase in perplexity when that layer alone is ternarized. Layer 0 is far more sensitive.</desc>

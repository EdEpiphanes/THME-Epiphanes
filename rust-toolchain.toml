# Pinned toolchain: CI and every developer build with exactly this compiler and clippy, so a new
# upstream release can never break the build on its own. Bump deliberately in a `chore(toolchain)`
# PR after the non-blocking "latest stable" CI job is green. The minimum supported version is
# `rust-version` in Cargo.toml (checked by the `msrv` CI job).
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"

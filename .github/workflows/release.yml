name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: thme
            gui_name: thme-gui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: thme.exe
            gui_name: thme-gui.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: thme
            gui_name: thme-gui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Distributables
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/ || true
          cp target/${{ matrix.target }}/release/${{ matrix.gui_name }} dist/ || true
          cd dist
          tar -czvf thme-${{ github.ref_name }}-${{ matrix.target }}.tar.gz *

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

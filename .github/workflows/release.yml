name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; only the publish job gets write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag and quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches Cargo.toml version
        run: |
          crate_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "v${crate_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${crate_version}"
            exit 1
          fi
      - name: Changelog has a section for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binaries (developer and runner paths remapped)
        shell: bash
        run: |
          set -euo pipefail
          # Cargo config cannot hold machine-specific prefixes, so the remap is built here.
          # RUSTFLAGS replaces .cargo/config.toml rustflags, so strip=symbols is repeated.
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          work="$PWD"
          if command -v cygpath >/dev/null; then
            cargo_home="$(cygpath -m "$cargo_home")"; rustup_home="$(cygpath -m "$rustup_home")"; work="$(cygpath -m "$work")"
          fi
          export RUSTFLAGS="-C strip=symbols --remap-path-prefix=${cargo_home}=/cargo --remap-path-prefix=${rustup_home}=/rustup --remap-path-prefix=${work}=/thme"
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Check binary size limits (AGENTS.md)
        shell: bash
        run: |
          set -euo pipefail
          dir="target/${{ matrix.target }}/release"
          cli_bytes=$(wc -c < "$dir/thme${{ matrix.ext }}")
          gui_bytes=$(wc -c < "$dir/thme-gui${{ matrix.ext }}")
          echo "CLI ${cli_bytes} bytes, GUI ${gui_bytes} bytes"
          test "$cli_bytes" -le $((16 * 1024 * 1024)) || { echo "::error::CLI binary exceeds 16 MiB"; exit 1; }
          test "$gui_bytes" -le $((25 * 1024 * 1024)) || { echo "::error::GUI binary exceeds 25 MiB"; exit 1; }

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about@0.9.3
      - name: Third-party licence notices
        run: cargo about generate --locked about.hbs -o THIRD_PARTY_LICENSES.html

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="thme-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          dir="target/${{ matrix.target }}/release"
          cp "$dir/thme${{ matrix.ext }}" "$dir/thme-gui${{ matrix.ext }}" "dist/$name/"
          cp LICENSE LICENSING.md README.md CHANGELOG.md THIRD_PARTY_LICENSES.html "dist/$name/"
          cp -r LICENSES "dist/$name/LICENSES"
          cp assets/fonts/OFL.txt "dist/$name/OFL-ChakraPetch.txt"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksum manifest
        run: cd dist && cat *.sha256 > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Sign archives (Minisign)
        env:
          # Password-less Minisign secret key (minisign -G -W). Visible to this step only.
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          if [ -z "${MINISIGN_KEY}" ]; then
            echo "::error::MINISIGN_KEY is not set; SECURITY.md promises signed archives, so the release stops."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          bash scripts/sign_artifacts.sh dist/
      - name: Verify signatures against minisign.pub
        run: |
          set -euo pipefail
          count=0
          for f in dist/*.tar.gz dist/SHA256SUMS.txt; do
            minisign -Vm "$f" -p minisign.pub
            count=$((count + 1))
          done
          test "$count" -ge 2
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.minisig
            dist/SHA256SUMS.txt

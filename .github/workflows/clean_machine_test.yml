name: Clean Machine Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  clean-test:
    name: Clean Machine Validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Build and Run Core Tests
        run: cargo test --test test_clean_machine

      - name: Build and Run Production Verification Dry-Run
        run: cargo run --release --example production_verification -- --dry-run

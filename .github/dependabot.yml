version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type:chore", "area:dependencies"]
    commit-message:
      prefix: "chore(deps)"
    # Major crate upgrades change APIs and are planned as backlog tickets
    # (for example THME-2002 for the eframe/egui stack), not merged from bot PRs.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      gui-stack:
        patterns: ["egui*", "eframe", "epaint*", "winit", "accesskit*", "rfd"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["type:chore", "area:ci"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["type:chore", "area:dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      vscode-extension:
        update-types: ["minor", "patch"]

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type:chore", "area:dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      gui-stack:
        patterns: ["egui*", "eframe", "epaint*", "winit", "accesskit*", "rfd"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["type:chore", "area:ci"]
    commit-message:
      prefix: "chore(ci)"

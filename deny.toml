# cargo-deny policy, enforced by the CI `dependencies` job.
# Run locally: cargo deny check advisories bans licenses sources

[graph]
all-features = false

[advisories]
version = 2
# Transitive "unmaintained" notices are warnings; direct dependencies must stay maintained.
unmaintained = "workspace"
# Every entry needs a backlog ticket and a reason. Review at each release.
ignore = [
    # quick-xml 0.30 via egui-winit -> accesskit_unix -> zbus_xml (Linux AT-SPI accessibility).
    # Needs a malicious same-user process on the local accessibility bus; impact is a Studio
    # slowdown or memory exhaustion. Fixed by THME-2002 (upgrade egui/eframe).
    { id = "RUSTSEC-2026-0194", reason = "local AT-SPI bus only; THME-2002" },
    { id = "RUSTSEC-2026-0195", reason = "local AT-SPI bus only; THME-2002" },
]

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive licences compatible with distributing THME under Apache-2.0.
# OFL-1.1, UFL-1.0 and Ubuntu-font-1.0 cover the fonts bundled by egui.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "LicenseRef-UFL-1.0",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Ubuntu-font-1.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
